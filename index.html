<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procrastinators</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 1.25vw; font-size: min(1.25vw, 2.2vh); }
  html, body {
    height: 100%; overflow: hidden;
    background: #121016; color: #f4efe6;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: inline-block; vertical-align: middle; }

  /* ---------- screens ---------- */
  .screen {
    display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 4.5vh 4.5vw; flex-direction: column;
  }
  .screen.on { display: flex; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2.4rem; }
  .brand { font-size: 2.3rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; display: flex; align-items: center; }
  .brand .dot { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: #ffb547; margin-right: 1rem; box-shadow: 0 0 1.2rem rgba(255,181,71,.6); }
  .tag { color: #9b93a8; font-size: 1.3rem; margin-top: .5rem; }
  .meta { color: #9b93a8; font-size: 1.4rem; text-align: right; }
  .meta strong { color: #f4efe6; font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit; font-size: 1.4rem; font-weight: 600; color: #f4efe6;
    background: #26222f; border: .2rem solid transparent; border-radius: .8rem;
    padding: .85rem 1.7rem; cursor: pointer; outline: none;
    display: inline-flex; align-items: center; justify-content: center;
    -webkit-transition: -webkit-transform .12s, background .12s, border-color .12s;
    transition: transform .12s, background .12s, border-color .12s;
  }
  .btn svg { width: 1.3em; height: 1.3em; margin-right: .55em; }
  .btn.icon-only svg { margin-right: 0; }
  .btn:focus, .btn:hover {
    border-color: #ffb547; background: #3a3247;
    -webkit-transform: scale(1.06); transform: scale(1.06);
    box-shadow: 0 0 0 .4rem rgba(255,181,71,.22);
  }
  .btn.primary { background: #ffb547; color: #1a1408; }
  .btn.primary:focus, .btn.primary:hover { background: #ffc978; border-color: #fff; }
  .btn.armed, .btn.armed:focus, .btn.armed:hover { background: #ff5a4e; color: #fff; border-color: #fff; }

  /* ---------- setup ---------- */
  .setup { flex: 1; display: flex; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col + .col { margin-left: 2.4rem; }
  .panel { background: #1d1a24; border-radius: 1.2rem; padding: 1.8rem 2rem; }
  .panel + .panel { margin-top: 1.4rem; }
  .panel h2 { font-size: 1.1rem; letter-spacing: .22em; text-transform: uppercase; color: #9b93a8; margin-bottom: 1.2rem; font-weight: 700; }
  .players-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .plist { flex: 1; overflow-y: auto; min-height: 0; padding: .4rem .6rem .4rem 0; }
  .prow { display: flex; align-items: center; justify-content: space-between; padding: .45rem 0; border-bottom: .1rem solid #2b2633; font-size: 1.9rem; font-weight: 600; }
  .prow .btn { padding: .5rem .8rem; background: transparent; color: #9b93a8; }
  .prow .btn:focus, .prow .btn:hover { color: #fff; background: #ff5a4e; border-color: #fff; }
  .empty { color: #6f6880; font-size: 1.5rem; padding: 1rem 0; }
  .addrow { display: flex; margin-top: 1.4rem; }
  .name-in {
    flex: 1; min-width: 0; margin-right: .9rem;
    font: inherit; font-size: 1.7rem; padding: .75rem 1.1rem;
    background: #121016; color: #f4efe6; border: .2rem solid #3a3247; border-radius: .8rem; outline: none;
  }
  .name-in:focus { border-color: #ffb547; }
  .stepper { display: flex; align-items: center; font-size: 1.8rem; color: #9b93a8; }
  .stepper .val { min-width: 3.8rem; text-align: center; font-size: 2.7rem; font-weight: 800; color: #f4efe6; font-variant-numeric: tabular-nums; }
  .stepper .word { margin: 0 1rem; }
  .stepper .btn { padding: .5rem .6rem; }
  .unit { color: #9b93a8; font-size: 1.5rem; margin-top: .9rem; }
  .panel h2.h2b { margin-top: 1.6rem; }
  .sndrow { display: flex; align-items: center; }
  .sndrow .icon-only { padding: .5rem .6rem; }
  .sndname { flex: 1; min-width: 0; text-align: center; font-size: 1.7rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 .5rem; }
  .sndrow #test-btn { margin-left: 1rem; font-size: 1.3rem; padding: .55rem 1rem; }
  .actions { display: flex; flex-direction: column; align-items: stretch; }
  .actions .btn { margin-top: 1rem; font-size: 1.6rem; padding: 1.1rem 1.7rem; }
  .actions .btn:first-child { margin-top: 0; }
  .actions .btn.primary { font-size: 2rem; padding: 1.1rem; }
  .hint { color: #6f6880; font-size: 1.15rem; margin-top: 1.1rem; line-height: 1.45; }

  /* ---------- board ---------- */
  .grid { flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; margin: -.8rem; min-height: 0; }
  .card {
    position: relative; margin: .8rem; padding: 1.6rem 1.9rem 1.4rem;
    background: #1d1a24; border: .2rem solid #2b2633; border-radius: 1.2rem;
    display: flex; flex-direction: column;
  }
  .card.lead { border-color: #ffb547; }
  .badge {
    position: absolute; top: -1.05rem; right: 1.4rem;
    background: #ffb547; color: #1a1408; font-size: 1rem; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase; padding: .35rem .8rem; border-radius: .5rem;
  }
  .card .name { font-size: 2.4rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pts { font-size: 7.5rem; font-weight: 800; line-height: 1; color: #ffb547; font-variant-numeric: tabular-nums; margin-top: .6rem; }
  .card .pts small { font-size: 1.6rem; color: #9b93a8; font-weight: 600; margin-left: .5rem; }
  .card.bump .pts { -webkit-animation: bump 1s ease-out; animation: bump 1s ease-out; }
  @-webkit-keyframes bump { 0% { -webkit-transform: scale(1); } 25% { -webkit-transform: scale(1.4); color: #ff5a4e; } 100% { -webkit-transform: scale(1); } }
  @keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.4); color: #ff5a4e; } 100% { transform: scale(1); } }
  .card .pts { -webkit-transform-origin: left bottom; transform-origin: left bottom; }
  .tally { display: flex; flex-wrap: wrap; margin-top: 1.1rem; min-height: 1rem; }
  .tally i { width: .85rem; height: .85rem; border-radius: 50%; margin: 0 .35rem .35rem 0; background: #322c3c; }
  .tally i.hit { background: #ff5a4e; }
  .grid.mid .name { font-size: 2rem; }
  .grid.mid .pts { font-size: 5.8rem; }
  .grid.many .card { padding: 1.2rem 1.4rem 1rem; }
  .grid.many .name { font-size: 1.7rem; }
  .grid.many .pts { font-size: 4.4rem; }

  .status { text-align: center; color: #9b93a8; font-size: 1.35rem; margin-top: 1.8rem; display: flex; align-items: center; justify-content: center; }
  .pulse { width: .8rem; height: .8rem; border-radius: 50%; background: #5fd39a; margin-right: .8rem; -webkit-animation: pulse 2s infinite; animation: pulse 2s infinite; }
  .pulse.off { background: #6f6880; -webkit-animation: none; animation: none; }
  @-webkit-keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .bar { display: flex; justify-content: center; margin-top: 1.6rem; }
  .bar .btn { margin: 0 .55rem; }

  /* ---------- self-check overlay ---------- */
  .overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 4.5vh 4.5vw; background: #2a0f12;
    -webkit-animation: alarm 1.1s ease-in-out infinite alternate; animation: alarm 1.1s ease-in-out infinite alternate;
  }
  .overlay.on { display: flex; }
  @-webkit-keyframes alarm { from { background: #241016; } to { background: #4d1519; } }
  @keyframes alarm { from { background: #241016; } to { background: #4d1519; } }
  .overlay h1 { font-size: 6.5rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: #ff5a4e; line-height: 1; }
  .overlay .q { font-size: 2.1rem; margin: 1.4rem 0 2.8rem; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; max-width: 92%; margin-bottom: 2.8rem; }
  .chip { font-size: 2.1rem; padding: 1.1rem 2.3rem; margin: .65rem; border-radius: 4rem; background: rgba(255,255,255,.09); }
  .chip svg { display: none; }
  .chip.sel { background: #ff5a4e; color: #fff; }
  .chip.sel svg { display: inline-block; }
  .chip.sel:focus, .chip.sel:hover { background: #ff7468; border-color: #fff; }
  .done { font-size: 1.9rem; padding: 1.2rem 2.6rem; }

  /* ---------- end screen ---------- */
  .results { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 74rem; margin: 0 auto; min-height: 0; }
  .awards { display: flex; margin-bottom: 2.2rem; }
  .award { flex: 1; background: #1d1a24; border-radius: 1.2rem; padding: 1.5rem 1.9rem; border: .2rem solid #2b2633; }
  .award + .award { margin-left: 1.6rem; }
  .award.hot { border-color: #ff5a4e; }
  .award.cool { border-color: #5fd39a; }
  .award .lbl { font-size: 1.05rem; letter-spacing: .2em; text-transform: uppercase; color: #9b93a8; font-weight: 700; }
  .award .who { font-size: 2.6rem; font-weight: 800; margin-top: .5rem; }
  .rlist { overflow-y: auto; min-height: 0; }
  .rrow { display: flex; align-items: baseline; padding: .8rem 1.4rem; font-size: 2rem; border-bottom: .1rem solid #2b2633; }
  .rrow .rk { width: 3.2rem; color: #6f6880; font-variant-numeric: tabular-nums; }
  .rrow .nm { flex: 1; font-weight: 600; }
  .rrow .sub { color: #9b93a8; font-size: 1.3rem; margin-right: 2.2rem; }
  .rrow .pt { font-weight: 800; color: #ffb547; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }

  .arow { display: flex; margin-top: 1rem; }
  .actions .arow .btn { flex: 1; margin-top: 0; font-size: 1.4rem; padding: .9rem 1rem; }
  .arow .btn + .btn { margin-left: 1rem; }

  /* ---------- end screen: QR ---------- */
  .endwrap { flex: 1; display: flex; align-items: center; min-height: 0; }
  .endwrap .results { margin: 0 3rem 0 0; max-width: none; height: 100%; }
  .qrcard { width: 25rem; flex: none; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .qrcard .qrbox { width: 14rem; }
  .qrcard .url { width: 100%; margin: 1rem 0; font-size: .9rem; line-height: 1.35; max-height: 8.2rem; text-align: left; background: #1d1a24; }
  .results.many .awards { margin-bottom: 1.2rem; }
  .results.many .award { padding: 1rem 1.5rem; }
  .results.many .award .who { font-size: 1.9rem; }
  .rlist.many { display: flex; flex-wrap: wrap; align-content: flex-start; }
  .rlist.many .rrow { width: 48%; margin-right: 2%; padding: .5rem 1rem; font-size: 1.6rem; }
  .rlist.huge .rrow { padding: .3rem 1rem; font-size: 1.4rem; }
  .rlist.many .rrow .sub { font-size: 1.15rem; }
  .qrbtns { display: flex; justify-content: center; }
  .qrbtns .btn + .btn { margin-left: .8rem; }
  .qrbox { background: #fff; border-radius: 1rem; padding: .5rem; line-height: 0; }
  .qrbox svg { width: 100%; height: auto; }
  .qrlbl { color: #9b93a8; font-size: 1.25rem; margin-top: .9rem; line-height: 1.35; }

  /* ---------- share window ---------- */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 12; background: rgba(10,8,14,.88); align-items: center; justify-content: center; }
  .modal.on { display: flex; }
  .sharebox { display: flex; align-items: center; background: #1d1a24; border-radius: 1.4rem; padding: 2.6rem; width: 80%; max-width: 76rem; }
  .sharebox .qrbox { width: 22rem; flex: none; margin-right: 2.8rem; }
  .sharetext { flex: 1; min-width: 0; }
  .sharetext h2 { font-size: 2.6rem; font-weight: 800; }
  .sharetext p { color: #9b93a8; font-size: 1.45rem; line-height: 1.45; margin-top: .8rem; }
  .url { font-family: Consolas, "DejaVu Sans Mono", monospace; font-size: 1.1rem; color: #c9c1d6; background: #121016; border-radius: .6rem; padding: .8rem 1rem; margin: 1.4rem 0 1.8rem; word-break: break-all; max-height: 6.6rem; overflow: hidden; }
  .sharebtns .btn { margin: 0 .8rem .6rem 0; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 19vh; z-index: 20; pointer-events: none;
    background: #f4efe6; color: #121016; font-size: 1.6rem; font-weight: 700;
    padding: 1rem 2.2rem; border-radius: 3rem; opacity: 0;
    -webkit-transform: translate(-50%, 2rem); transform: translate(-50%, 2rem);
    -webkit-transition: opacity .25s, -webkit-transform .25s; transition: opacity .25s, transform .25s;
  }
  #toast.on { opacity: 1; -webkit-transform: translate(-50%, 0); transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="s-setup" class="screen">
  <header class="top">
    <div>
      <div class="brand"><i class="dot"></i><span data-t="title"></span></div>
      <div class="tag" data-t="tagline"></div>
    </div>
    <div class="meta" data-t="hint"></div>
  </header>
  <div class="setup">
    <div class="col panel players-panel">
      <h2 data-t="players"></h2>
      <div id="plist" class="plist"></div>
      <div class="addrow">
        <input id="name-in" class="name-in" type="text" maxlength="20" autocomplete="off" spellcheck="false">
        <button class="btn" id="add-btn" data-fid="add" data-icon="plus"><span class="lbl" data-t="add"></span></button>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <h2 data-t="interval"></h2>
        <div class="stepper">
          <button class="btn icon-only" id="min-dec" data-fid="min-dec" data-icon="minus"></button>
          <span class="val" id="min-val"></span>
          <button class="btn icon-only" id="min-inc" data-fid="min-inc" data-icon="plus"></button>
          <span class="word" data-t="to"></span>
          <button class="btn icon-only" id="max-dec" data-fid="max-dec" data-icon="minus"></button>
          <span class="val" id="max-val"></span>
          <button class="btn icon-only" id="max-inc" data-fid="max-inc" data-icon="plus"></button>
        </div>
        <div class="unit" id="unit"></div>
        <h2 class="h2b" data-t="sound"></h2>
        <div class="sndrow">
          <button class="btn icon-only" id="snd-prev" data-fid="snd-prev" data-icon="left"></button>
          <span class="sndname" id="snd-name"></span>
          <button class="btn icon-only" id="snd-next" data-fid="snd-next" data-icon="right"></button>
          <button class="btn" id="test-btn" data-fid="test" data-icon="sound"><span class="lbl" data-t="testSound"></span></button>
        </div>
      </div>
      <div class="panel actions">
        <button class="btn primary" id="start-btn" data-fid="start" data-icon="play"><span class="lbl"></span></button>
        <div class="arow">
          <button class="btn" id="share-btn" data-fid="share" data-icon="share"><span class="lbl" data-t="shareSetup"></span></button>
          <button class="btn" id="reset-btn" data-fid="reset" data-icon="x"><span class="lbl" data-t="resetPoints"></span></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ BOARD ============ -->
<section id="s-board" class="screen">
  <header class="top">
    <div class="brand"><i class="dot"></i><span data-t="title"></span></div>
    <div class="meta"><span data-t="session"></span> <strong id="clock">0:00:00</strong> &nbsp;&middot;&nbsp; <strong id="ncheck">0</strong> <span id="ncheck-lbl"></span></div>
  </header>
  <div id="grid" class="grid"></div>
  <div class="status"><i id="pulse" class="pulse"></i><span id="status"></span></div>
  <div class="bar">
    <button class="btn" id="checknow-btn" data-fid="checknow" data-icon="bell"><span class="lbl" data-t="checkNow"></span></button>
    <button class="btn" id="pause-btn" data-fid="pause" data-default="1"></button>
    <button class="btn" id="undo-btn" data-fid="undo" data-icon="undo"><span class="lbl" data-t="undo"></span></button>
    <button class="btn" id="end-btn" data-fid="end" data-icon="flag"><span class="lbl" data-t="end"></span></button>
    <button class="btn" id="setup-btn" data-fid="setup" data-icon="menu"><span class="lbl" data-t="setup"></span></button>
  </div>
</section>

<!-- ============ END ============ -->
<section id="s-end" class="screen">
  <header class="top">
    <div class="brand"><i class="dot"></i><span data-t="endTitle"></span></div>
    <div class="meta" id="end-meta"></div>
  </header>
  <div class="endwrap">
    <div class="results">
      <div class="awards" id="awards"></div>
      <div class="rlist" id="rlist"></div>
    </div>
    <div class="qrcard">
      <div class="qrbox" id="end-qr"></div>
      <div class="qrlbl" data-t="continueQr"></div>
      <div class="url" id="end-url"></div>
      <div class="qrbtns">
        <button class="btn" id="end-copy-btn" data-fid="endcopy" data-icon="copy"><span class="lbl" data-t="copyLink"></span></button>
        <button class="btn" id="end-nshare-btn" data-fid="endnshare" data-icon="share"><span class="lbl" data-t="shareVia"></span></button>
      </div>
    </div>
  </div>
  <div class="bar">
    <button class="btn primary" id="keep-btn" data-fid="keep" data-icon="play"><span class="lbl" data-t="keepGoing"></span></button>
    <button class="btn" id="reset2-btn" data-fid="reset2" data-icon="x"><span class="lbl" data-t="resetPoints"></span></button>
  </div>
</section>

<!-- ============ SELF-CHECK ============ -->
<div id="check" class="overlay">
  <h1 data-t="checkTitle"></h1>
  <p class="q" data-t="checkQ"></p>
  <div class="chips" id="chips"></div>
  <button class="btn primary done" id="done-btn" data-fid="done" data-icon="check"><span class="lbl"></span></button>
</div>

<!-- ============ SHARE ============ -->
<div id="share" class="modal">
  <div class="sharebox">
    <div class="qrbox" id="share-qr"></div>
    <div class="sharetext">
      <h2 id="share-title"></h2>
      <p id="share-desc"></p>
      <div class="url" id="share-url"></div>
      <div class="sharebtns">
        <button class="btn primary" id="copy-btn" data-fid="copy" data-icon="copy"><span class="lbl" data-t="copyLink"></span></button>
        <button class="btn" id="nshare-btn" data-fid="nshare" data-icon="share"><span class="lbl" data-t="shareVia"></span></button>
        <button class="btn" id="close-share-btn" data-fid="closeshare" data-icon="x"><span class="lbl" data-t="close"></span></button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

  }

  /* ======================================================
     State
     ====================================================== */
  function defaults() {
    return { players: [], nextId: 1, minMin: 10, maxMin: 45, sound: 'trombone', checks: [], started: false, elapsed: 0 };
  }
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) { s = null; }
    var d = defaults();
    if (!s || !s.players || !s.checks) return d;
    if (s.started === undefined && s.sessionStart) s.started = true; /* older saved data */
    for (var k in d) { if (d.hasOwnProperty(k) && s[k] === undefined) s[k] = d[k]; }
    return s;
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* storage unavailable: still works, just not remembered */ }
  }

  var state = load();
  var running = false, paused = false, nextAt = 0, remaining = 0;
  var checkOpen = false, selected = {}, repeatTimer = null, bumped = [];

  function $(id) { return document.getElementById(id); }
  function fmt(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k]; }); }
  function hasSession() { return state.checks.length > 0 || state.started; }
  function player(id) { for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i]; return null; }
  function pointsOf(p) {
    var n = 0;
    for (var i = p.since || 0; i < state.checks.length; i++) if (state.checks[i].caught.indexOf(p.id) >= 0) n++;
    return n;
  }
  function checksFor(p) { return Math.max(0, state.checks.length - (p.since || 0)); }
  function ranked() {
    var arr = state.players.map(function (p, i) { return { p: p, pts: pointsOf(p), i: i }; });
    arr.sort(function (a, b) { return b.pts - a.pts || a.i - b.i; });
    return arr;
  }
  function hms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;

  }
  function randomDelay() {
    var a = state.minMin, b = state.maxMin;
    return (a + Math.random() * (b - a)) * UNIT_MS;
  }

  /* ======================================================

      clearTimeout(armed[key].timer);

      btn.classList.remove('armed');
      armed[key] = null;
      fn();
      return;
    }
    armed[key] = {
      text: lbl.textContent,
      timer: setTimeout(function () {
        if (!armed[key]) return;
        lbl.textContent = armed[key].text;
        btn.classList.remove('armed');
        armed[key] = null;
      }, 4000)
    };
    lbl.textContent = TXT.confirmAgain;
    btn.classList.add('armed');
  }

  /* ======================================================
     Sound — Web Audio chime, with a generated WAV fallback
     ====================================================== */
  var actx = null, wavUrl = null;
  var NOTES = [523.25, 659.25, 783.99, 1046.5];

  function unlockAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx && AC) { try { actx = new AC(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
  }

  /* The self-check jingle: two bars of funk in E at 118 BPM
     (slap bass, offbeat wah stabs, drums), ending on a big E9 stab. ~5 s. */
  function playFunk(c, dst, T) {
    var s16 = 60 / 118 / 4;
    var noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    var nd = noiseBuf.getChannelData(0);
    for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    function at(step) { return T + step * s16; }
    function note(semi) { return 82.407 * Math.pow(2, semi / 12); } /* semitones above E2 */
    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    function osc(type, freq, t, len, target) {
      var o = c.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.connect(target); o.start(t); o.stop(t + len + 0.05);
      return o;
    }
    function noise(t, len, type, freq, q, peak, decay) {
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noiseBuf; s.loop = true;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      env(g, t, peak, 0.002, decay);
      s.connect(f); f.connect(g); g.connect(dst);
      s.start(t); s.stop(t + len);
    }
    function kick(t) {
      var g = c.createGain(); g.connect(dst);
      env(g, t, 0.9, 0.003, 0.3);
      var o = osc('sine', 150, t, 0.35, g);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    }
    function snare(t, vol) {
      noise(t, 0.22, 'bandpass', 1900, 0.8, 0.5 * vol, 0.17);
      var g = c.createGain(); g.connect(dst);
      env(g, t, 0.22 * vol, 0.002, 0.09);
      var o = osc('triangle', 230, t, 0.12, g);
      o.frequency.exponentialRampToValueAtTime(165, t + 0.08);
    }
    function hat(t, open) { noise(t, open ? 0.35 : 0.06, 'highpass', 7500, 0.5, open ? 0.13 : 0.1, open ? 0.28 : 0.035); }
    function bass(t, freq, len) {
      var f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.Q.value = 9;
      f.frequency.setValueAtTime(2600, t);
      f.frequency.exponentialRampToValueAtTime(260, t + Math.max(0.1, len * 0.85));
      env(g, t, 0.42, 0.004, len);
      f.connect(g); g.connect(dst);
      osc('sawtooth', freq, t, len, f);
      osc('square', freq * 1.004, t, len, f);
    }
    function stab(t, freqs, len, peak, wahFrom, wahTo) {
      var f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.Q.value = 3.5;
      f.frequency.setValueAtTime(wahFrom, t);
      f.frequency.exponentialRampToValueAtTime(wahTo, t + len);
      env(g, t, peak, 0.006, len);
      f.connect(g); g.connect(dst);
      for (var k = 0; k < freqs.length; k++) {
        osc('sawtooth', freqs[k], t, len, f);
        osc('sawtooth', freqs[k] * 1.006, t, len, f);
      }
    }

    /* bass riff: [16th step, semitones above E2, length in 16ths] */
    var BASS = [[0, 0, 2], [3, 12, 1], [6, 3, 1], [7, 5, 2], [10, 0, 1], [11, 7, 1], [12, 10, 1], [14, 12, 2],
                [16, 0, 2], [19, 12, 1], [22, 3, 1], [23, 5, 1], [24, 6, 1], [25, 7, 2], [28, 10, 1], [29, 12, 1], [30, 10, 1], [31, 7, 1]];
    BASS.forEach(function (b) { bass(at(b[0]), note(b[1]), b[2] * s16 * 0.92); });

    var E9 = [note(16), note(22), note(26)]; /* G#3 D4 F#4 */
    [2, 5, 9, 13, 18, 21, 25, 27].forEach(function (st) { stab(at(st), E9, s16 * 0.85, 0.16, 500, 2400); });

    [0, 7, 10, 16, 23, 26].forEach(function (st) { kick(at(st)); });
    [4, 12, 20, 28].forEach(function (st) { snare(at(st), 1); });
    [15, 30, 31].forEach(function (st) { snare(at(st), 0.35); });
    for (var h = 0; h < 32; h += 2) hat(at(h), h === 14 || h === 30);
    [11, 27].forEach(function (st) { hat(at(st), false); });

    /* the big finish */
    var end = at(32);
    kick(end);
    noise(end, 1.8, 'highpass', 4500, 0.4, 0.2, 1.6);
    bass(end, note(0), 1.3);
    stab(end, [note(12), note(16), note(22), note(26), note(31)], 1.4, 0.2, 450, 3200);
  }

  /* Small synth toolkit shared by the comedy sounds */
  function kit(c, dst) {
    var buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var K = {};
    K.env = function (g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    };
    K.osc = function (type, freq, t, len, target) {
      var o = c.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.connect(target); o.start(t); o.stop(t + len + 0.05);
      return o;
    };
    K.noise = function (t, len, type, freq, q, peak, decay) {
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = buf; s.loop = true;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      K.env(g, t, peak, 0.002, decay);
      s.connect(f); f.connect(g); g.connect(dst);
      s.start(t); s.stop(t + len);
    };
    K.drum = function (t, f0, f1, peak, decay) { /* kick / tom / timpani */
      var g = c.createGain(); g.connect(dst);
      K.env(g, t, peak, 0.003, decay);
      var o = K.osc('sine', f0, t, decay + 0.05, g);
      o.frequency.exponentialRampToValueAtTime(f1, t + Math.min(0.15, decay * 0.5));
    };
    K.lfo = function (t, len, rate, depth, param) {
      var o = c.createOscillator(), g = c.createGain();
      o.frequency.value = rate;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(depth, t + Math.min(0.5, len * 0.4));
      o.connect(g); g.connect(param);
      o.start(t); o.stop(t + len);
    };
    return K;
  }

  /* "Wah wah wah waaah" — muted trombone sliding down, wobbly last note. ~3.2 s */
  function sadTrombone(c, dst, T) {
    var K = kit(c, dst);
    var NOTES_T = [[0, 293.66, 0.44], [0.52, 277.18, 0.44], [1.04, 261.63, 0.44], [1.56, 246.94, 1.6]];
    NOTES_T.forEach(function (n, idx) {
      var t = T + n[0], len = n[2], last = idx === NOTES_T.length - 1;
      var f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.Q.value = 7;
      f.frequency.setValueAtTime(320, t);                         /* plunger closed... */
      f.frequency.linearRampToValueAtTime(1500, t + 0.13);         /* ...open = "wah" */
      f.frequency.linearRampToValueAtTime(last ? 850 : 450, t + len);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.05);
      g.gain.setValueAtTime(0.5, t + len - 0.14);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      f.connect(g); g.connect(dst);
      var oscs = [K.osc('sawtooth', n[1] * 0.96, t, len, f), K.osc('sawtooth', n[1] * 0.96 * 1.006, t, len, f)];
      oscs.forEach(function (o, k) { o.frequency.exponentialRampToValueAtTime(n[1] * (k ? 1.006 : 1), t + 0.09); }); /* scoop into the note */
      if (last) {
        oscs.forEach(function (o) { K.lfo(t + 0.25, len - 0.25, 5.5, 7, o.frequency); });
        K.lfo(t + 0.25, len - 0.25, 5.5, 380, f.frequency);        /* wah-wah-wah wobble */
      }
    });
  }

  /* Dramatic "dun dun DUNNN" — two brass hits and a long trembling one, with timpani. ~3.3 s */
  function dunDun(c, dst, T) {
    var K = kit(c, dst);
    function hit(t, freqs, len, long, peak) {
      var f = c.createBiquadFilter(), g = c.createGain(), out = c.createGain();
      f.type = 'lowpass'; f.Q.value = 1.5;
      f.frequency.setValueAtTime(3000, t);
      f.frequency.exponentialRampToValueAtTime(long ? 900 : 600, t + len);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.02);
      if (long) {
        g.gain.exponentialRampToValueAtTime(peak * 0.55, t + 0.5);
        g.gain.setValueAtTime(peak * 0.55, t + len - 0.8);
      }
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      f.connect(g); g.connect(out); out.connect(dst);
      if (long) { out.gain.value = 0.7; K.lfo(t + 0.2, len - 0.2, 12, 0.3, out.gain); } /* string tremolo */
      freqs.forEach(function (fr) { K.osc('sawtooth', fr, t, len, f); K.osc('sawtooth', fr * 1.005, t, len, f); });
      K.drum(t, 95, 48, 0.85, long ? 1.4 : 0.45);
    }
    var Dm = [73.42, 146.83, 174.61, 220.0];    /* D2 D3 F3 A3 */
    var Cdim = [69.3, 138.59, 164.81, 196.0];   /* C#2 C#3 E3 G3 */
    hit(T, Dm, 0.3, false, 0.2);
    hit(T + 0.45, Dm, 0.3, false, 0.2);
    hit(T + 0.95, Cdim, 2.3, true, 0.24);
    K.noise(T + 0.95, 2.2, 'highpass', 5000, 0.3, 0.12, 2.0);
  }

  /* Cartoon slide whistle, then "ba-dum-tss". ~3 s */
  function rimshot(c, dst, T) {
    var K = kit(c, dst);
    var g = c.createGain(); g.connect(dst);
    g.gain.setValueAtTime(0.0001, T);
    g.gain.exponentialRampToValueAtTime(0.28, T + 0.05);
    g.gain.setValueAtTime(0.28, T + 0.62);
    g.gain.exponentialRampToValueAtTime(0.0001, T + 0.78);
    var w = K.osc('sine', 520, T, 0.8, g);
    w.frequency.exponentialRampToValueAtTime(1950, T + 0.72);
    K.lfo(T, 0.8, 7, 30, w.frequency);
    var b = T + 1.0;
    K.drum(b, 260, 170, 0.6, 0.22);                       /* ba  */
    K.noise(b, 0.12, 'bandpass', 2200, 1, 0.3, 0.08);
    K.drum(b + 0.19, 160, 105, 0.7, 0.3);                 /* dum */
    var s = b + 0.46;
    K.drum(s, 130, 45, 0.85, 0.32);                       /* tss: kick + cymbal */
    K.noise(s, 1.7, 'highpass', 5200, 0.3, 0.3, 1.4);
    K.noise(s, 0.5, 'bandpass', 8500, 1.2, 0.16, 0.35);
  }

  /* The original bell chime */
  function bellChime(c, dst, T) {
    var K = kit(c, dst);
    for (var r = 0; r < 2; r++) {
      for (var i = 0; i < NOTES.length; i++) {
        var s = T + r * 1.1 + i * 0.16;
        var g1 = c.createGain(), g2 = c.createGain();
        g1.connect(dst); g2.connect(dst);
        K.env(g1, s, 0.55, 0.015, 1.0);
        K.env(g2, s, 0.14, 0.015, 0.45);
        K.osc('sine', NOTES[i], s, 1.0, g1);
        K.osc('sine', NOTES[i] * 2, s, 0.45, g2);
      }
    }
  }

  var SOUNDS = [
    { id: 'trombone', name: TXT.sndTrombone, play: sadTrombone },
    { id: 'dun', name: TXT.sndDun, play: dunDun },
    { id: 'rimshot', name: TXT.sndRimshot, play: rimshot },
    { id: 'funk', name: TXT.sndFunk, play: playFunk },
    { id: 'bell', name: TXT.sndBell, play: bellChime }
  ];
  function soundIndex(id) {
    id = id || state.sound;
    for (var i = 0; i < SOUNDS.length; i++) if (SOUNDS[i].id === id) return i;
    return 0;
  }

  var master = null, voice = null;
  function chime(id) {
    unlockAudio();
    var snd = SOUNDS[soundIndex(typeof id === 'string' ? id : null)];
    if (actx) {
      try {
        if (!master) {
          master = actx.createGain();
          master.gain.value = 0.6;
          if (actx.createDynamicsCompressor) {
            var comp = actx.createDynamicsCompressor();
            master.connect(comp); comp.connect(actx.destination);
          } else {
            master.connect(actx.destination);
          }
        }
        if (voice) { /* cut off whatever is still playing */
          var old = voice;
          try { old.gain.setTargetAtTime(0.0001, actx.currentTime, 0.03); } catch (e) {}
          setTimeout(function () { try { old.disconnect(); } catch (e) {} }, 400);
        }
        voice = actx.createGain();
        voice.connect(master);
        snd.play(actx, voice, actx.currentTime + 0.06);
        return;
      } catch (e) { /* fall through to WAV */ }
    }
    try {
      var a = new Audio(makeWav());
      var p = a.play();
      if (p && p['catch']) p['catch'](function () {});
    } catch (e) {}
  }

  function makeWav() {
    if (wavUrl) return wavUrl;
    var sr = 22050, len = Math.floor(sr * 2.7), i, r, n;
    function u32(x) { return String.fromCharCode(x & 255, (x >> 8) & 255, (x >> 16) & 255, (x >>> 24) & 255); }
    function u16(x) { return String.fromCharCode(x & 255, (x >> 8) & 255); }
    var parts = ['RIFF' + u32(36 + len * 2) + 'WAVEfmt ' + u32(16) + u16(1) + u16(1) + u32(sr) + u32(sr * 2) + u16(2) + u16(16) + 'data' + u32(len * 2)];
    for (i = 0; i < len; i++) {
      var t = i / sr, v = 0;
      for (r = 0; r < 2; r++) for (n = 0; n < 4; n++) {
        var dt = t - (r * 1.1 + n * 0.16);
        if (dt >= 0) v += Math.sin(2 * Math.PI * NOTES[n] * dt) * Math.exp(-dt * 4) * Math.min(1, dt * 200) * 0.22;
      }
      var x = Math.round(Math.max(-1, Math.min(1, v)) * 32767);
      if (x < 0) x += 65536;
      parts.push(String.fromCharCode(x & 255, (x >> 8) & 255));
    }
    wavUrl = 'data:audio/wav;base64,' + btoa(parts.join(''));
    return wavUrl;
  }

  /* Keep the screen awake where the browser supports it */
  function requestWake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen')['catch'](function () {});
    } catch (e) {}
  }

  /* ======================================================
     Screens
     ====================================================== */
  function show(name) {
    current = name;
    ['setup', 'board', 'end'].forEach(function (n) { $('s-' + n).className = 'screen' + (n === name ? ' on' : ''); });
    if (name === 'setup') renderSetup();
    if (name === 'board') renderBoard();
    if (name === 'end') renderEnd();
    blur();
    if (name === 'setup') (state.players.length ? $('start-btn') : $('add-btn')).focus();
    if (name === 'end') $('keep-btn').focus();
  }

  function blur() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

  /* ---------- setup ---------- */
  function renderSetup() {
    var list = $('plist');
    list.innerHTML = '';
    if (!state.players.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = TXT.noPlayers;
      list.appendChild(e);
    }
    state.players.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'prow';
      var nm = document.createElement('span');
      nm.textContent = p.name;
      var b = document.createElement('button');
      b.className = 'btn icon-only';
      b.setAttribute('data-fid', 'rm-' + p.id);
      b.setAttribute('aria-label', 'Remove ' + p.name);
      b.innerHTML = icon('x');
      b.onclick = function () { removePlayer(p.id); };
      row.appendChild(nm); row.appendChild(b);
      list.appendChild(row);
    });
    $('min-val').textContent = state.minMin;
    $('max-val').textContent = state.maxMin;
    $('unit').textContent = FAST ? TXT.seconds : TXT.minutes;
    $('snd-name').textContent = SOUNDS[soundIndex()].name;
    $('start-btn').querySelector('.lbl').textContent = hasSession() ? TXT.cont : TXT.start;
    $('reset-btn').style.display = hasSession() ? '' : 'none';
  }

  function addPlayer() {
    var input = $('name-in');
    var name = input.value.replace(/\s+/g, ' ').replace(/^\s|\s$/g, '');
    if (!name) { input.focus(); return; }
    if (state.players.length >= MAX_PLAYERS) { toast(TXT.tooMany); return; }
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].name.toLowerCase() === name.toLowerCase()) { toast(TXT.duplicate); return; }
    }
    state.players.push({ id: state.nextId++, name: name, since: state.checks.length });
    save();
    input.value = '';
    renderSetup();
    var rows = $('plist').querySelectorAll('.prow');
    if (rows.length) try { rows[rows.length - 1].scrollIntoView(false); } catch (e) {}
  }

  function removePlayer(id) {
    var idx = -1;
    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) idx = i;
    if (idx < 0) return;
    state.players.splice(idx, 1);
    save();
    renderSetup();
    var btns = $('plist').querySelectorAll('button');
    if (btns.length) btns[Math.min(idx, btns.length - 1)].focus();
    else $('add-btn').focus();
  }

  function step(which, dir) {
    var v = which === 'min' ? state.minMin : state.maxMin;
    var inc = dir > 0 ? (v >= 10 ? 5 : 1) : (v > 10 ? 5 : 1);
    v = Math.max(1, Math.min(180, v + dir * inc));
    if (which === 'min') { state.minMin = v; if (state.maxMin < v) state.maxMin = v; }
    else { state.maxMin = v; if (state.minMin > v) state.minMin = v; }
    save();
    renderSetup();
  }

  function cycleSound(d) {
    var i = (soundIndex() + d + SOUNDS.length) % SOUNDS.length;
    state.sound = SOUNDS[i].id;
    save();
    $('snd-name').textContent = SOUNDS[i].name;
    chime();
  }

  function startSession() {
    if (!state.players.length) { toast(TXT.needPlayer); $('add-btn').focus(); return; }
    unlockAudio();
    state.started = true;
    save();
    running = true; paused = false;
    nextAt = Date.now() + randomDelay();
    requestWake();
    show('board');
  }

  function resetSession() {
    state.checks = [];
    state.started = false;
    state.elapsed = 0;
    state.players.forEach(function (p) { p.since = 0; });
    save();
    running = false; paused = false;
    toast(TXT.resetDone);
    show('setup');
  }

  /* ---------- board ---------- */
  function renderBoard() {
    var grid = $('grid'), list = ranked(), n = list.length;
    var cols = n <= 4 ? Math.max(n, 1) : n <= 6 ? 3 : n <= 8 ? 4 : n <= 10 ? 5 : 6;
    grid.className = 'grid' + (n > 8 ? ' many' : n > 4 ? ' mid' : '');
    grid.innerHTML = '';
    var maxPts = n ? list[0].pts : 0;
    var leaders = list.filter(function (r) { return r.pts === maxPts; }).length;
    list.forEach(function (r) {
      var p = r.p, card = document.createElement('div');
      var isTop = maxPts > 0 && r.pts === maxPts && leaders < n;
      card.className = 'card' + (isTop ? ' lead' : '') + (bumped.indexOf(p.id) >= 0 ? ' bump' : '');
      card.style.width = 'calc(' + (100 / cols) + '% - 1.6rem)';
      var html = '';
      if (isTop) html += '<span class="badge">' + TXT.topSlacker + '</span>';
      html += '<div class="name"></div>';
      html += '<div class="pts">' + r.pts + '<small>' + (r.pts === 1 ? TXT.pt1 : TXT.ptN) + '</small></div>';
      html += '<div class="tally">';
      var from = Math.max(p.since || 0, state.checks.length - 40);
      for (var i = from; i < state.checks.length; i++) {
        html += '<i' + (state.checks[i].caught.indexOf(p.id) >= 0 ? ' class="hit"' : '') + '></i>';
      }
      html += '</div>';
      card.innerHTML = html;
      card.querySelector('.name').textContent = p.name;
      grid.appendChild(card);
    });
    bumped = [];
    renderPauseBtn();
    tick();
  }

  function renderPauseBtn() {
    $('pause-btn').innerHTML = icon(paused ? 'play' : 'pause') + '<span class="lbl">' + (paused ? TXT.resume : TXT.pause) + '</span>';
  }

  function togglePause() {
    if (!paused) { remaining = Math.max(0, nextAt - Date.now()); paused = true; }
    else { nextAt = Date.now() + remaining; paused = false; }
    renderPauseBtn();
    tick();
  }

  function undoLast() {
    if (!state.checks.length) { toast(TXT.nothingToUndo); return; }
    state.checks.pop();
    state.players.forEach(function (p) { if ((p.since || 0) > state.checks.length) p.since = state.checks.length; });
    save();
    renderBoard();
    toast(TXT.undone);
  }

  function endSession() {
    running = false;
    save();
    show('end');
  }

  /* ---------- self-check ---------- */
  function openCheck() {
    if (checkOpen || !state.players.length) return;
    checkOpen = true;
    selected = {};
    var box = $('chips');
    box.innerHTML = '';
    state.players.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'btn chip';
      b.setAttribute('data-fid', 'chip-' + p.id);
      b.innerHTML = icon('check');
      b.appendChild(document.createTextNode(p.name));
      b.onclick = function () {
        selected[p.id] = !selected[p.id];
        b.className = 'btn chip' + (selected[p.id] ? ' sel' : '');
        updateDone();
      };
      box.appendChild(b);
    });
    updateDone();
    $('check').className = 'overlay on';
    chime();
    clearTimeout(repeatTimer);
    repeatTimer = setTimeout(function () { if (checkOpen) chime(); }, 45000);
    blur();
    var first = box.querySelector('button');
    if (first) first.focus();
  }

  function selectedIds() {
    return state.players.filter(function (p) { return selected[p.id]; }).map(function (p) { return p.id; });
  }

  function updateDone() {
    var n = selectedIds().length;
    $('done-btn').querySelector('.lbl').textContent = n === 0 ? TXT.nobody : n === 1 ? TXT.give1 : fmt(TXT.giveN, { n: n });
  }

  function closeCheck() {
    if (!checkOpen) return;
    var caught = selectedIds();
    state.checks.push({ at: Date.now(), caught: caught });
    save();
    checkOpen = false;
    clearTimeout(repeatTimer);
    $('check').className = 'overlay';
    if (paused) remaining = randomDelay(); else nextAt = Date.now() + randomDelay();
    bumped = caught;
    renderBoard();
    blur();
    if (caught.length) {
      toast(fmt(TXT.caughtToast, { names: caught.map(function (id) { return player(id).name; }).join(', ') }));
    } else {
      toast(TXT.cleanRound);
    }
  }

  /* ---------- end ---------- */
  function renderEnd() {
    var list = ranked(), nChecks = state.checks.length;
    var dur = state.elapsed;
    shareLink = buildLink(true);
    $('end-qr').innerHTML = qrSvg(shareLink);
    $('end-url').textContent = shareLink;
    $('end-meta').textContent = fmt(TXT.endMeta, { time: hms(dur), n: nChecks, checks: nChecks === 1 ? TXT.check1 : TXT.checkN });

    var aw = $('awards');
    aw.innerHTML = '';
    if (list.length) {
      var maxP = list[0].pts, minP = list[list.length - 1].pts;
      var names = function (pts) {
        var n = list.filter(function (r) { return r.pts === pts; }).map(function (r) { return r.p.name; });
        return n.length > 3 ? n.slice(0, 2).join(', ') + ' +' + (n.length - 2) : n.join(', ');
      };
      if (maxP === minP) {
        aw.appendChild(award('', TXT.tied, TXT.everyone));
      } else {
        aw.appendChild(award('hot', TXT.chief, names(maxP)));
        aw.appendChild(award('cool', TXT.focused, names(minP)));
      }
    }

    var rl = $('rlist');
    rl.className = 'rlist' + (list.length > 6 ? ' many' : '') + (list.length > 10 ? ' huge' : '');
    document.querySelector('#s-end .results').className = 'results' + (list.length > 6 ? ' many' : '');
    rl.innerHTML = '';
    var rank = 0, prev = null;
    list.forEach(function (r, i) {
      if (r.pts !== prev) { rank = i + 1; prev = r.pts; }
      var row = document.createElement('div');
      row.className = 'rrow';
      row.innerHTML = '<span class="rk">' + rank + '.</span><span class="nm"></span><span class="sub"></span><span class="pt">' + r.pts + '</span>';
      row.querySelector('.nm').textContent = r.p.name;
      row.querySelector('.sub').textContent = fmt(TXT.caughtOf, { a: r.pts, b: checksFor(r.p) });
      rl.appendChild(row);
    });
  }

  function award(cls, label, who) {
    var d = document.createElement('div');
    d.className = 'award ' + cls;
    d.innerHTML = '<div class="lbl"></div><div class="who"></div>';
    d.querySelector('.lbl').textContent = label;
    d.querySelector('.who').textContent = who;
    return d;
  }

  /* ======================================================
     Links: the whole setup (and optionally the session) lives in the URL
       ?n=Marek,Jana   names (each URL-encoded)
       &i=10-45        interval
       &s=trombone     sound
       &c=1.0.3        checks: one bitmask per check (base 36, bit = player)
       &j=0,0,2        check index each player joined at (only if needed)
       &t=1830         session seconds so far
     ====================================================== */
  function baseUrl() { return location.href.split('#')[0].split('?')[0]; }

  function buildLink(withSession) {
    var q = [
      'n=' + state.players.map(function (p) { return encodeURIComponent(p.name); }).join(','),
      'i=' + state.minMin + '-' + state.maxMin,
      's=' + state.sound
    ];
    if (withSession) {
      var ids = state.players.map(function (p) { return p.id; });
      q.push('c=' + state.checks.map(function (ch) {
        var mask = 0;
        ch.caught.forEach(function (id) { var k = ids.indexOf(id); if (k >= 0) mask += Math.pow(2, k); });
        return mask.toString(36);
      }).join('.'));
      if (state.players.some(function (p) { return p.since > 0; })) {
        q.push('j=' + state.players.map(function (p) { return p.since || 0; }).join(','));
      }
      q.push('t=' + Math.round(state.elapsed / 1000));
    }
    if (FAST) q.push('fast=1');
    return baseUrl() + '?' + q.join('&');
  }

  function readQuery() {
    var out = {}, qs = location.search.replace(/^\?/, '');
    if (!qs) return out;
    qs.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[kv.slice(0, i)] = kv.slice(i + 1); /* raw — decoded per field below */
    });
    return out;
  }
  function dec(x) { try { return decodeURIComponent(x.replace(/\+/g, ' ')); } catch (e) { return x; } }

  function applyLink() {
    var q = readQuery();
    if (!q.n) return false;
    var seen = {}, names = [];
    q.n.split(',').forEach(function (raw) {
      var nm = dec(raw).replace(/\s+/g, ' ').replace(/^\s|\s$/g, '').slice(0, 20);
      if (nm && !seen[nm.toLowerCase()] && names.length < MAX_PLAYERS) { seen[nm.toLowerCase()] = 1; names.push(nm); }
    });
    if (!names.length) return false;

    var st = defaults();
    st.sound = state.sound;
    st.players = names.map(function (nm, k) { return { id: k + 1, name: nm, since: 0 }; });
    st.nextId = names.length + 1;
    var iv = /^(\d+)-(\d+)$/.exec(q.i || '');
    if (iv) {
      st.minMin = Math.max(1, Math.min(180, +iv[1]));
      st.maxMin = Math.max(st.minMin, Math.min(180, +iv[2]));
    }
    if (q.s) for (var k = 0; k < SOUNDS.length; k++) if (SOUNDS[k].id === q.s) st.sound = q.s;

    var isSession = q.c !== undefined || q.t !== undefined;
    if (isSession) {
      if (q.c) {
        st.checks = q.c.split('.').map(function (m) {
          var mask = parseInt(m, 36) || 0, caught = [];
          st.players.forEach(function (p, idx) { if (Math.floor(mask / Math.pow(2, idx)) % 2) caught.push(p.id); });
          return { at: 0, caught: caught };
        });
      }
      if (q.j) q.j.split(',').forEach(function (v, idx) {
        if (st.players[idx]) st.players[idx].since = Math.max(0, Math.min(st.checks.length, parseInt(v, 10) || 0));
      });
      st.elapsed = Math.max(0, (parseInt(q.t, 10) || 0) * 1000);
      st.started = true;
    }
    state = st;
    save();
    /* clean the address bar, so a bookmark or reload doesn't re-apply the link */
    try { history.replaceState(null, '', baseUrl() + (FAST ? '?fast=1' : '')); } catch (e) {}
    return isSession ? 'session' : 'setup';
  }

  function qrSvg(text) {
    if (typeof qrcode !== 'function') return '';
    try {
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount(), m = 3, size = n + m * 2, d = '';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
      }
      return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
        '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    } catch (e) { return ''; }
  }

  function openShare(withSession) {
    if (!state.players.length) { toast(TXT.needPlayer); return; }
    shareLink = buildLink(withSession);
    $('share-title').textContent = withSession ? TXT.shareSessionTitle : TXT.shareSetupTitle;
    $('share-desc').textContent = withSession ? TXT.shareSessionDesc : TXT.shareSetupDesc;
    $('share-url').textContent = shareLink;
    $('share-qr').innerHTML = qrSvg(shareLink);
    $('share-qr').style.display = $('share-qr').innerHTML ? '' : 'none';
    shareOpen = true;
    $('share').className = 'modal on';
    blur();
    $('copy-btn').focus();
  }

  function closeShare() {
    shareOpen = false;
    $('share').className = 'modal';
    blur();
    var back = $('share-btn');
    if (back && visible(back)) back.focus();
  }

  function copyLink() {
    var btn = document.activeElement;
    function fallback() {
      var ok = false, ta = document.createElement('textarea');
      ta.value = shareLink;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      try { ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? TXT.copied : TXT.copyFailed);
      if (btn && btn.focus) btn.focus();
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink).then(function () { toast(TXT.copied); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }

  function nativeShare() {
    try {
      var p = navigator.share({ title: TXT.title, url: shareLink });
      if (p && p['catch']) p['catch'](function () {});
    } catch (e) {}
  }

  /* ======================================================
     Clock
     ====================================================== */
  function tick() {
    var now = Date.now();
    if (running && !paused) {
      state.elapsed += Math.min(now - lastTick, 5000); /* cap: ignore time the TV spent asleep */
      if (now - lastSave > 10000) { lastSave = now; save(); }
    }
    lastTick = now;
    if (running && !paused && !checkOpen && now >= nextAt) openCheck();
    if (current !== 'board') return;
    $('clock').textContent = hms(state.elapsed);
    $('ncheck').textContent = state.checks.length;
    $('ncheck-lbl').textContent = state.checks.length === 1 ? TXT.check1 : TXT.checkN;
    var st;
    if (paused) st = TXT.statusPaused;
    else if (FAST) st = fmt(TXT.statusFast, { s: Math.max(0, Math.ceil((nextAt - now) / 1000)) });
    else st = TXT.statusRunning;
    $('status').textContent = st;
    $('pulse').className = 'pulse' + (paused ? ' off' : '');
  }

  /* ======================================================
     Remote control: spatial navigation with arrows + OK
     ====================================================== */
  function visible(el) {
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && el.offsetParent !== null;
  }
  function activeRoot() { return checkOpen ? $('check') : shareOpen ? $('share') : $('s-' + current); }
  function focusables() {
    var all = activeRoot().querySelectorAll('button, input');
    var out = [];
    for (var i = 0; i < all.length; i++) if (!all[i].disabled && visible(all[i])) out.push(all[i]);
    return out;
  }

  function move(dir) {
    var list = focusables();
    if (!list.length) return;
    var cur = document.activeElement;
    if (list.indexOf(cur) < 0) {
      var def = null;
      for (var d = 0; d < list.length; d++) if (list[d].getAttribute('data-default')) def = list[d];
      (def || list[0]).focus();
      return;
    }
    var a = cur.getBoundingClientRect();
    var cx = a.left + a.width / 2, cy = a.top + a.height / 2;
    var best = null, bestScore = Infinity;
    list.forEach(function (el) {
      if (el === cur) return;
      var r = el.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy, main, side;
      if (dir === 'left') { if (dx >= -1) return; main = -dx; side = Math.abs(dy); }
      if (dir === 'right') { if (dx <= 1) return; main = dx; side = Math.abs(dy); }
      if (dir === 'up') { if (dy >= -1) return; main = -dy; side = Math.abs(dx); }
      if (dir === 'down') { if (dy <= 1) return; main = dy; side = Math.abs(dx); }
      var score = main + side * 2.5;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) {
      best.focus();
      try { best.scrollIntoView(false); } catch (e) {}
    }
  }

  function onBack() {
    if (checkOpen) return;
    if (shareOpen) { closeShare(); return; }
    if (current === 'end') keepGoing();
  }

  document.addEventListener('keydown', function (e) {
    unlockAudio();
    var k = e.keyCode, t = document.activeElement;
    var inInput = t && t.tagName === 'INPUT';
    var dir = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' }[k];
    if (dir) {
      if (inInput && (dir === 'left' || dir === 'right')) {
        var pos = t.selectionStart, len = t.value.length;
        if (dir === 'left' && pos > 0) return;
        if (dir === 'right' && pos < len) return;
      }
      e.preventDefault();
      move(dir);
      return;
    }
    if (k === 13) {
      if (inInput) { e.preventDefault(); addPlayer(); return; }
      if (t && t.tagName === 'BUTTON') { e.preventDefault(); t.click(); }
      else { e.preventDefault(); move('down'); }
      return;
    }
    if (k === 8 && inInput) return;
    if (k === 8 || k === 27 || k === 461 || k === 10009) { e.preventDefault(); onBack(); }
  }, true);

  document.addEventListener('click', unlockAudio, true);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running) requestWake();
  });

  /* ======================================================
     Wiring
     ====================================================== */
  function keepGoing() {
    running = true;
    if (!paused) nextAt = Date.now() + randomDelay();
    show('board');
  }

  function init() {
    var i, els;
    els = document.querySelectorAll('[data-t]');
    for (i = 0; i < els.length; i++) els[i].textContent = TXT[els[i].getAttribute('data-t')];
    els = document.querySelectorAll('[data-icon]');
    for (i = 0; i < els.length; i++) els[i].insertAdjacentHTML('afterbegin', icon(els[i].getAttribute('data-icon')));
    $('name-in').setAttribute('placeholder', TXT.namePlaceholder);
    document.title = TXT.title;

    $('add-btn').onclick = addPlayer;
    $('min-dec').onclick = function () { step('min', -1); };
    $('min-inc').onclick = function () { step('min', 1); };
    $('max-dec').onclick = function () { step('max', -1); };
    $('max-inc').onclick = function () { step('max', 1); };
    $('test-btn').onclick = function () { chime(); };
    $('snd-prev').onclick = function () { cycleSound(-1); };
    $('snd-next').onclick = function () { cycleSound(1); };
    $('start-btn').onclick = startSession;
    $('reset-btn').onclick = function () { confirmTwice($('reset-btn'), resetSession); };

    $('checknow-btn').onclick = openCheck;
    $('pause-btn').onclick = togglePause;
    $('undo-btn').onclick = function () { confirmTwice($('undo-btn'), undoLast); };
    $('end-btn').onclick = endSession;
    $('setup-btn').onclick = function () { running = false; show('setup'); };

    $('keep-btn').onclick = keepGoing;
    $('reset2-btn').onclick = function () { confirmTwice($('reset2-btn'), resetSession); };

    $('done-btn').onclick = closeCheck;

    $('share-btn').onclick = function () { openShare(false); };
    $('end-copy-btn').onclick = copyLink;
    $('end-nshare-btn').onclick = nativeShare;
    $('copy-btn').onclick = copyLink;
    $('nshare-btn').onclick = nativeShare;
    $('close-share-btn').onclick = closeShare;
    if (!navigator.share) { $('nshare-btn').style.display = 'none'; $('end-nshare-btn').style.display = 'none'; }

    var fromLink = applyLink();

    show('setup');
    if (fromLink) toast(fromLink === 'session' ? TXT.loadedSession : TXT.loadedSetup);
    setInterval(tick, 500);
  }

  init();
})();
</script>
</body>
</html>
